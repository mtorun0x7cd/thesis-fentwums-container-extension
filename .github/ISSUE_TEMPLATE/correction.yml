name: Correction
description: Report an error in the thesis, its sources, the evaluation data or the documentation.
title: "Correction: "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: >-
        The deposited thesis does not change: a confirmed error is added to ERRATA.md.
        Please check ERRATA.md first. A matter that should not be public goes by e-mail,
        as SECURITY.md describes.
  - type: dropdown
    id: item
    attributes:
      label: Item
      description: Where the error is.
      options:
        - The deposited thesis (publication/, the tag epub-3597)
        - The sources of the thesis (thesis/)
        - The evaluation data or scripts (evaluation/)
        - The README or other documentation
        - The citation metadata (CITATION.cff, codemeta.json)
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location
      description: The page and section of the thesis, or the file and line.
      placeholder: "p. 52 (PDF p. 67), Section 6.1"
    validations:
      required: true
  - type: textarea
    id: quoted-text
    attributes:
      label: Quoted text
      description: The passage as it stands, verbatim.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: A source, a measurement or a passage of the thesis that supports the correction.
    validations:
      required: true
  - type: checkboxes
    id: errata
    attributes:
      label: ERRATA.md
      options:
        - label: I checked ERRATA.md
          required: true
