name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - production
    paths-ignore:
      - 'README.md'
      - '.gitignore'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - production
    paths-ignore:
      - 'README.md'
      - '.gitignore'

# Least privilege by default; the release job opts into write below.
permissions:
  contents: read

jobs:
  build:
    name: Build and Test LaTeX Documents
    runs-on: ubuntu-latest
    container:
      # Digest-pinned for reproducibility (xu-cheng/texlive-full:latest as of 2026-07-02).
      image: ghcr.io/xu-cheng/texlive-full@sha256:11383430b9a3e48c0b79339f34d8092f942f897d91ab3749d4899d06731fea7f
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # bash is required by the Makefile's pinned SHELL; the texlive image is
      # Alpine and ships only BusyBox ash.
      - name: Install system dependencies
        run: |
          apk add --no-cache bash make git python3

      - name: Lint LaTeX documents
        run: make check

      - name: Compile LaTeX documents
        run: |
          make clean && make report

      - name: Upload compiled PDFs as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiled-deliverables
          path: |
            .tmp.nosync/pdf/main.pdf

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      # Digest-pinned for reproducibility (xu-cheng/texlive-full:latest as of 2026-07-02).
      image: ghcr.io/xu-cheng/texlive-full@sha256:11383430b9a3e48c0b79339f34d8092f942f897d91ab3749d4899d06731fea7f
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          apk add --no-cache bash make git python3

      - name: Compile release deliverables
        run: |
          make clean && make report

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            .tmp.nosync/pdf/main.pdf
          # Static body only. Do NOT use generate_release_notes: re-pushing a tag
          # duplicates the changelog.
          body: |
            Release ${{ github.ref_name }}. See the README for documentation.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
