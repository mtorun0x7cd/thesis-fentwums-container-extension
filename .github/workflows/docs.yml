name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint Markdown
        # Lint all authored Markdown. Only the machine-generated benchmark result
        # tables under results/ are excluded — they are data artifacts emitted by
        # the aggregation script, not hand-authored documentation.
        run: npx --yes markdownlint-cli2@0.23.0 "**/*.md" "!evaluation/benchmarking_suite/results/**"
