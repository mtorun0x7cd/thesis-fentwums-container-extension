<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <!-- Filter for glow effect -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="var(--accent)" flood-opacity="var(--glow-opacity)"/>
        </filter>
    </defs>

    <style>
        :root {
            --text-title: #0f172a;
            --text-subtitle: #475569;
            --text-badge: #475569;
            --accent: #2563eb;
            --badge-border: #cbd5e1;
            --glow-opacity: 0.05;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --text-title: #ffffff;
                --text-subtitle: #94a3b8;
                --text-badge: #64748b;
                --accent: #60a5fa;
                --badge-border: #334155;
                --glow-opacity: 0.25;
            }
        }
        .bg-border {
            stroke: var(--accent);
            stroke-opacity: 0.15;
        }
        .accent-stroke {
            stroke: var(--accent);
        }
        .accent-fill {
            fill: var(--accent);
        }
        .text-title {
            fill: var(--text-title);
        }
        .text-subtitle {
            fill: var(--text-subtitle);
        }
        .text-badge-dev {
            fill: var(--text-title);
        }
        .text-badge-gh {
            fill: var(--text-badge);
        }
        .badge-rect-dev {
            fill: var(--accent);
            fill-opacity: 0.12;
            stroke: var(--accent);
            stroke-opacity: 0.3;
        }
        .badge-rect-gh {
            stroke: var(--badge-border);
        }
        .divider {
            stroke: var(--accent);
        }
    </style>

    <!-- Outer border/frame -->
    <rect x="20" y="20" width="1160" height="590" rx="16" fill="none" class="bg-border" stroke-width="2"/>

    <!-- Centered visual icon group: OneWare core bridging to a rootless container -->
    <g transform="translate(370, -105.5)" filter="url(#glow)">
        <!-- Outer box: extension / system frame -->
        <rect x="130" y="215" width="200" height="200" rx="16" fill="none" class="accent-stroke" stroke-width="6"/>

        <!-- OneWare IDE core (top box) -->
        <rect x="160" y="240" width="140" height="50" rx="6" fill="none" class="accent-stroke" stroke-width="4"/>
        <line x1="175" y1="265" x2="285" y2="265" class="accent-stroke" stroke-width="3" stroke-linecap="round"/>
        <line x1="175" y1="275" x2="245" y2="275" class="accent-stroke" stroke-width="3" stroke-linecap="round"/>

        <!-- Connection arrow (transparent execution API) -->
        <path d="M 230 290 L 230 335" fill="none" class="accent-stroke" stroke-width="4" stroke-linecap="round"/>
        <path d="M 225 328 L 230 335 L 235 328" fill="none" class="accent-stroke" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Container / Docker environment (bottom box) -->
        <rect x="160" y="340" width="140" height="50" rx="6" fill="none" class="accent-stroke" stroke-width="4"/>
        <line x1="195" y1="340" x2="195" y2="390" class="accent-stroke" stroke-width="3"/>
        <line x1="230" y1="340" x2="230" y2="390" class="accent-stroke" stroke-width="3"/>
        <line x1="265" y1="340" x2="265" y2="390" class="accent-stroke" stroke-width="3"/>
    </g>

    <!-- Centered information block (text) -->
    <g transform="translate(600, 360)">
        <!-- Project title -->
        <text x="0" y="30" font-family="'SF Pro Display', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="22" font-weight="900" letter-spacing="1.2" class="text-title" text-anchor="middle">ONEWARE CONTAINER EXTENSION</text>

        <!-- Center-aligned divider line -->
        <line x1="-200" y1="65" x2="200" y2="65" class="divider" stroke-width="3" stroke-linecap="round"/>

        <!-- Tagline / subtitle -->
        <text x="0" y="110" font-family="'SF Pro Text', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="16" font-weight="500" class="text-subtitle" letter-spacing="0.5" text-anchor="middle">Modular Integration of Containerized EDA Toolchains (Docker/Podman)</text>

        <!-- Technical domain badge -->
        <g transform="translate(-187.5, 155)">
            <rect x="0" y="0" width="180" height="36" rx="8" class="badge-rect-dev" stroke-width="1.5"/>
            <text x="90" y="22" font-family="'SF Pro Text', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="12" font-weight="700" class="text-badge-dev" text-anchor="middle" letter-spacing="1">ACADEMIC WORK</text>
        </g>

        <!-- GitHub handle badge -->
        <g transform="translate(7.5, 155)">
            <rect x="0" y="0" width="180" height="36" rx="8" fill="none" class="badge-rect-gh" stroke-width="1.5"/>
            <text x="90" y="22" font-family="'SF Pro Text', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="12" font-weight="700" class="text-badge-gh" text-anchor="middle" letter-spacing="1">@mtorun0x7cd</text>
        </g>
    </g>
</svg>
