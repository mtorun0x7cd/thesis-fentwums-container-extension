# Deterministic LuaLaTeX build configuration for the thesis report.
#
# Referenced explicitly with `latexmk -norc -r latexmk.conf` (see the repository
# Makefile). Keeping -norc ensures no host-level ~/.latexmkrc can perturb the
# build; -r loads this committed configuration regardless, so local and CI
# builds are identical.

$pdf_mode   = 4;   # 4 = LuaLaTeX (OpenType fonts via fontspec/unicode-math)
$lualatex   = 'lualatex -interaction=nonstopmode -file-line-error -synctex=1 %O %S';
$bibtex_use = 2;   # resolve the bibliography with biber; clean .bbl under `-C`

# biblatex rewrites main.run.xml on every LuaLaTeX pass with cosmetically
# different content. Without ignoring it as a rerun trigger, latexmk never sees
# a stable fixpoint and aborts once it reaches the pass cap. Ignoring the file's
# content hash lets the build converge on the genuine TOC/reference fixpoint.
$hash_calc_ignore_pattern{'run.xml'} = '.*';
$max_repeat = 7;   # headroom for biblatex + hyperref + TikZ to settle
